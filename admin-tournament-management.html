<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ren Gaming — Tournament Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080808;color:#fff;min-height:100vh}
header{background:#0d0d0d;border-bottom:1px solid #292929;padding:20px 6%;display:flex;justify-content:space-between;align-items:center}
.logo{color:#ff1e1e;font-size:24px;font-weight:900}
button,.btn{font-family:inherit;cursor:pointer}
.logout,.back{background:#171717;color:#fff;border:1px solid #333;padding:10px 16px;border-radius:6px;text-decoration:none}
.logout:hover,.back:hover{border-color:#ff1e1e}
.container{max-width:1200px;margin:35px auto;padding:0 20px}
h1{margin-bottom:25px}
.card{background:#111;border:1px solid #292929;border-radius:10px;padding:25px;margin-bottom:25px}
h2{margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
label{font-size:13px;color:#aaa}
input,textarea,select{width:100%;background:#080808;color:#fff;border:1px solid #333;border-radius:6px;padding:12px}
textarea{min-height:100px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:#ff1e1e}
.check{display:flex;align-items:center;gap:10px;margin-top:10px}
.check input{width:auto}
.primary,.secondary,.danger{color:#fff;border:0;padding:11px 18px;border-radius:6px;font-weight:bold;cursor:pointer}
.primary{background:#e31313}
.primary:hover{background:#ff2424}
.secondary{background:#242424;border:1px solid #444}
.secondary:hover{border-color:#ff1e1e}
.danger{background:#5b1616;border:1px solid #8b2525}
.danger:hover{background:#7a1d1d}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.message{display:none;padding:12px;border-radius:6px;margin-bottom:18px}
.success{display:block;background:#102814;border:1px solid #238636;color:#7ee787}
.error{display:block;background:#2b1010;border:1px solid #ff1e1e;color:#ff7777}
.note{color:#888;font-size:13px;margin-top:10px;line-height:1.5}
.tournament-list{display:grid;gap:15px}
.tournament-item{background:#0b0b0b;border:1px solid #292929;border-radius:8px;padding:18px}
.tournament-header{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
.tournament-name{font-size:19px;font-weight:bold}
.tournament-meta{color:#999;font-size:13px;line-height:1.7;margin-top:7px}
.status{display:inline-block;padding:5px 9px;border-radius:5px;font-size:11px;font-weight:bold;text-transform:uppercase;white-space:nowrap}
.status-upcoming{background:#3a2b00;color:#ffd666}
.status-ongoing{background:#0d3518;color:#6ee7a0}
.status-completed{background:#242424;color:#aaa}
.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.empty{color:#888;background:#0b0b0b;border:1px solid #292929;padding:18px;border-radius:8px}
.hidden{display:none!important}
@media(max-width:700px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.tournament-header{flex-direction:column}.header-actions{display:flex;gap:8px;flex-wrap:wrap}.header-actions .back,.header-actions .logout{padding:9px 12px}}
</style>
</head>
<body>

<header>
  <div class="logo">REN GAMING — ADMIN</div>
  <div class="header-actions">
    <a class="back" href="admin.html">← ADMIN PANEL</a>
    <button class="logout" id="logoutBtn">LOGOUT</button>
  </div>
</header>

<div class="container">
  <h1>🏆 Tournament Management</h1>

  <div id="message" class="message"></div>

  <div class="card">
    <h2 id="formTitle">Create New Tournament</h2>

    <form id="tournamentForm">
      <input type="hidden" id="editingId">
      <div class="grid">

        <div class="field">
          <label>Tournament Name *</label>
          <input id="name" required placeholder="e.g. Ren Gaming Championship">
        </div>

        <div class="field">
          <label>Game *</label>
          <input id="game" required value="Moba Legends: 5v5!">
        </div>

        <div class="field full">
          <label>Description</label>
          <textarea id="description" placeholder="Tournament description"></textarea>
        </div>

        <div class="field">
          <label>Start Date & Time</label>
          <input id="start_date" type="datetime-local">
        </div>

        <div class="field">
          <label>Registration Deadline</label>
          <input id="registration_deadline" type="datetime-local">
        </div>

        <div class="field">
          <label>Entry Fee (₹)</label>
          <input id="entry_fee" type="number" min="0" step="1" value="0">
        </div>

        <div class="field">
          <label>Prize (₹)</label>
          <input id="prize" type="number" min="0" step="1" value="1000">
        </div>

        <div class="field">
          <label>Team Size</label>
          <input id="team_size" type="number" min="1" value="5">
        </div>

        <div class="field">
          <label>Maximum Teams</label>
          <input id="max_teams" type="number" min="1" placeholder="e.g. 32">
        </div>

        <div class="field">
          <label>Status</label>
          <select id="status">
            <option value="upcoming">Upcoming</option>
            <option value="ongoing">Ongoing</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <div class="field">
          <label>Registration</label>
          <div class="check">
            <input id="registration_open" type="checkbox" checked>
            <span>Registration Open</span>
          </div>
        </div>

      </div>

      <div class="form-actions">
        <button class="primary" id="submitBtn" type="submit">CREATE TOURNAMENT</button>
        <button class="secondary hidden" id="cancelEditBtn" type="button">CANCEL EDIT</button>
      </div>
      <p class="note" id="formNote">Create a new tournament. Existing tournaments can be edited or deleted from the list below.</p>
    </form>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px;flex-wrap:wrap;">
      <h2 style="margin-bottom:0">📋 Existing Tournaments</h2>
      <button class="secondary" id="refreshBtn" type="button">REFRESH</button>
    </div>
    <div id="tournamentsContainer" class="tournament-list">
      Loading tournaments...
    </div>
  </div>
</div>

<script>
const SUPABASE_URL="https://bixpvxkpnaqdifmvkhvp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_XtzkrIFbBPTGUmoLHqHu5Q_XeznKoVI";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

function showMessage(text,type){
  const el=document.getElementById("message");
  el.textContent=text;
  el.className="message "+type;
  setTimeout(()=>el.className="message",5000);
}

function escapeHtml(value){
  if(value===null||value===undefined)return "";
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function checkAdmin(){
  const {data:{user}}=await supabaseClient.auth.getUser();
  if(!user){window.location.href="login.html";return false}

  const {data:profile,error}=await supabaseClient
    .from("profiles").select("role").eq("id",user.id).single();

  if(error||!profile||profile.role!=="admin"){
    alert("Admin access required.");
    window.location.href="dashboard.html";
    return false;
  }
  return true;
}

function toIso(id){
  const value=document.getElementById(id).value;
  return value ? new Date(value).toISOString() : null;
}

function toLocalDateTime(value){
  if(!value)return "";
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return "";
  const local=new Date(date.getTime()-date.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,16);
}

function resetForm(){
  document.getElementById("tournamentForm").reset();
  document.getElementById("editingId").value="";
  document.getElementById("game").value="Moba Legends: 5v5!";
  document.getElementById("entry_fee").value="0";
  document.getElementById("prize").value="1000";
  document.getElementById("team_size").value="5";
  document.getElementById("registration_open").checked=true;
  document.getElementById("formTitle").textContent="Create New Tournament";
  document.getElementById("submitBtn").textContent="CREATE TOURNAMENT";
  document.getElementById("cancelEditBtn").classList.add("hidden");
  document.getElementById("formNote").textContent="Create a new tournament. Existing tournaments can be edited or deleted from the list below.";
}

function editTournament(tournament){
  document.getElementById("editingId").value=tournament.id;
  document.getElementById("name").value=tournament.name||"";
  document.getElementById("game").value=tournament.game||"Moba Legends: 5v5!";
  document.getElementById("description").value=tournament.description||"";
  document.getElementById("start_date").value=toLocalDateTime(tournament.start_date);
  document.getElementById("registration_deadline").value=toLocalDateTime(tournament.registration_deadline);
  document.getElementById("entry_fee").value=tournament.entry_fee ?? 0;
  document.getElementById("prize").value=tournament.prize ?? 0;
  document.getElementById("team_size").value=tournament.team_size ?? 5;
  document.getElementById("max_teams").value=tournament.max_teams ?? "";
  document.getElementById("status").value=tournament.status||"upcoming";
  document.getElementById("registration_open").checked=tournament.registration_open !== false;

  document.getElementById("formTitle").textContent="Edit Tournament";
  document.getElementById("submitBtn").textContent="SAVE CHANGES";
  document.getElementById("cancelEditBtn").classList.remove("hidden");
  document.getElementById("formNote").textContent="You are editing this tournament. Save changes when finished.";
  window.scrollTo({top:0,behavior:"smooth"});
}

async function loadTournaments(){
  const container=document.getElementById("tournamentsContainer");
  container.innerHTML="Loading tournaments...";

  const {data,error}=await supabaseClient
    .from("tournament")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    container.innerHTML='<div class="empty">Unable to load tournaments.</div>';
    return;
  }

  if(!data||data.length===0){
    container.innerHTML='<div class="empty">No tournaments found.</div>';
    return;
  }

  container.innerHTML=data.map(tournament=>{
    const status=tournament.status||"upcoming";
    const statusClass=status==="ongoing"?"status-ongoing":status==="completed"?"status-completed":"status-upcoming";
    const start=tournament.start_date?new Date(tournament.start_date).toLocaleString():"Not set";
    const deadline=tournament.registration_deadline?new Date(tournament.registration_deadline).toLocaleString():"Not set";
    const registration=tournament.registration_open===false?"Closed":"Open";
    const teamSize=tournament.team_size?String(tournament.team_size)+"v"+String(tournament.team_size):"5v5";

    return `
      <div class="tournament-item">
        <div class="tournament-header">
          <div>
            <div class="tournament-name">${escapeHtml(tournament.name||"Unnamed Tournament")}</div>
            <div class="tournament-meta">
              Game: ${escapeHtml(tournament.game||"Not set")}<br>
              Start: ${escapeHtml(start)}<br>
              Registration Deadline: ${escapeHtml(deadline)}<br>
              Entry Fee: ₹${escapeHtml(tournament.entry_fee??0)} &nbsp;|&nbsp;
              Prize: ₹${escapeHtml(tournament.prize??0)}<br>
              Format: ${escapeHtml(teamSize)} &nbsp;|&nbsp;
              Maximum Teams: ${escapeHtml(tournament.max_teams??"Unlimited")} &nbsp;|&nbsp;
              Registration: ${escapeHtml(registration)}
            </div>
          </div>
          <span class="status ${statusClass}">${escapeHtml(status)}</span>
        </div>

        <div class="item-actions">
          <button class="secondary" type="button" onclick='editTournament(${JSON.stringify(tournament).replace(/'/g,"&#039;")})'>EDIT</button>
          <button class="danger" type="button" onclick="deleteTournament('${escapeHtml(tournament.id)}','${escapeHtml(tournament.name||"Unnamed Tournament")}')">DELETE</button>
        </div>
      </div>
    `;
  }).join("");
}

document.getElementById("tournamentForm").addEventListener("submit",async(e)=>{
  e.preventDefault();

  const editingId=document.getElementById("editingId").value;

  const payload={
    name:document.getElementById("name").value.trim(),
    game:document.getElementById("game").value.trim(),
    description:document.getElementById("description").value.trim()||null,
    start_date:toIso("start_date"),
    registration_deadline:toIso("registration_deadline"),
    entry_fee:Number(document.getElementById("entry_fee").value||0),
    prize:Number(document.getElementById("prize").value||0),
    team_size:Number(document.getElementById("team_size").value||5),
    max_teams:document.getElementById("max_teams").value
      ? Number(document.getElementById("max_teams").value)
      : null,
    status:document.getElementById("status").value,
    registration_open:document.getElementById("registration_open").checked
  };

  if(!payload.name||!payload.game){
    showMessage("Tournament name and game are required.","error");
    return;
  }

  const button=document.getElementById("submitBtn");
  button.disabled=true;
  button.textContent=editingId?"SAVING...":"CREATING...";

  let result;

  if(editingId){
    result=await supabaseClient
      .from("tournament")
      .update(payload)
      .eq("id",editingId);
  }else{
    result=await supabaseClient
      .from("tournament")
      .insert(payload);
  }

  button.disabled=false;

  if(result.error){
    console.error(result.error);
    button.textContent=editingId?"SAVE CHANGES":"CREATE TOURNAMENT";
    showMessage("Unable to save tournament: "+result.error.message,"error");
    return;
  }

  showMessage(editingId?"Tournament updated successfully.":"Tournament created successfully.","success");
  resetForm();
  await loadTournaments();
});

async function deleteTournament(id,name){
  const confirmed=confirm(
    "Delete this tournament?\n\n"+
    name+
    "\n\nThis action cannot be undone."
  );

  if(!confirmed)return;

  const {error}=await supabaseClient
    .from("tournament")
    .delete()
    .eq("id",id);

  if(error){
    console.error(error);
    showMessage("Unable to delete tournament: "+error.message,"error");
    return;
  }

  showMessage("Tournament deleted successfully.","success");
  resetForm();
  await loadTournaments();
}

document.getElementById("cancelEditBtn").addEventListener("click",()=>{
  resetForm();
});

document.getElementById("refreshBtn").addEventListener("click",loadTournaments);

document.getElementById("logoutBtn").addEventListener("click",async()=>{
  await supabaseClient.auth.signOut();
  window.location.href="login.html";
});

(async()=>{
  const ok=await checkAdmin();
  if(!ok)return;
  await loadTournaments();
})();
</script>
</body>
</html>
