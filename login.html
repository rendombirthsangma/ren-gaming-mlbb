<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Login | Ren Gaming</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050505;margin:0;font-family:Arial,sans-serif}
    .login-page{width:100%;max-width:430px;padding:20px;box-sizing:border-box}
    .login-card{background:#111;border:1px solid #292929;padding:40px 30px;border-radius:12px;text-align:center}
    .login-logo{width:70px;height:70px;margin:0 auto 20px;display:block;object-fit:contain;border-radius:12px}
    .login-card h1{color:white;margin-bottom:8px}
    .login-card p{color:#999;margin-bottom:30px;line-height:1.6}
    .google-btn{width:100%;padding:14px;border:1px solid #444;background:white;color:#111;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer}
    .google-btn:hover{background:#eee}.google-btn:disabled{opacity:.6;cursor:not-allowed}
    .message{margin-top:20px;font-size:14px;color:#aaa;min-height:20px;overflow-wrap:anywhere;line-height:1.5}
    .back-home{display:inline-block;margin-top:25px;color:#e50914;text-decoration:none}
    .back-home:hover{text-decoration:underline}
  </style>
</head>
<body>
<main class="login-page">
  <section class="login-card">
    <img class="login-logo" src="ren-gaming-rg.png" alt="Ren Gaming RG logo">
    <h1>Welcome to Ren Gaming</h1>
    <p>Sign in with Google to register for tournaments and manage your account.</p>
    <button id="googleLogin" class="google-btn" type="button">Continue with Google</button>
    <div id="loginMessage" class="message" role="status" aria-live="polite"></div>
    <a href="index.html" class="back-home">← Back to Ren Gaming</a>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  "use strict";
  const SUPABASE_URL = "https://bixpvxkpnaqdifmvkhvp.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_XtzkrIFbBPTGUmoLHqHu5Q_XeznKoVI";
  const message = document.getElementById("loginMessage");
  const button = document.getElementById("googleLogin");

  if (!window.supabase) {
    message.textContent = "Login service failed to load. Please refresh and try again.";
    button.disabled = true;
    return;
  }

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { flowType: "pkce", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  function getReturnUrl() {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get("redirect");
    if (!raw) return "index.html";
    try {
      const target = new URL(raw, window.location.origin);
      // Only allow a relative path on this same website.
      if (target.origin !== window.location.origin) return "index.html";
      return target.pathname.replace(/^\//, "") + target.search + target.hash;
    } catch (_) {
      return "index.html";
    }
  }

  const returnUrl = getReturnUrl();
  const oauthCallback = new URL("login.html", window.location.href);
  oauthCallback.searchParams.set("redirect", returnUrl);

  let redirecting = false;
  async function redirectUser(user) {
    if (!user || redirecting) return;
    redirecting = true;
    button.disabled = true;
    message.textContent = "Login successful. Taking you back...";

    try {
      const { data: profile, error } = await supabaseClient
        .from("profiles").select("role").eq("id", user.id).maybeSingle();
      if (error) console.warn("Could not read profile role:", error.message);

      const role = String(profile?.role || "").trim().toLowerCase();
      if (role === "admin" && (!new URLSearchParams(location.search).has("redirect"))) {
        window.location.replace("admin.html");
        return;
      }

      if (!profile) {
        const metadataName = user.user_metadata?.full_name || user.user_metadata?.name || "";
        const { error: insertError } = await supabaseClient.from("profiles").upsert({
          id: user.id, full_name: metadataName, role: "user"
        }, { onConflict: "id", ignoreDuplicates: true });
        if (insertError) console.warn("Profile creation warning:", insertError.message);
      }

      window.location.replace(returnUrl);
    } catch (err) {
      console.error("Login redirect check:", err);
      window.location.replace(returnUrl);
    }
  }

  button.addEventListener("click", async () => {
    button.disabled = true;
    message.textContent = "Opening Google login...";
    try {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: oauthCallback.href }
      });
      if (error) throw error;
    } catch (err) {
      console.error(err);
      message.textContent = err.message || "Unable to start Google login. Please try again.";
      button.disabled = false;
    }
  });

  async function initialize() {
    const params = new URLSearchParams(location.search);
    if (params.has("error")) {
      message.textContent = "Google login error: " + (params.get("error_description") || params.get("error")).replace(/\+/g, " ");
      return;
    }
    message.textContent = "Checking your login session...";
    const { data, error } = await supabaseClient.auth.getSession();
    if (error) {
      message.textContent = "Unable to check your login session. Please refresh and try again.";
      return;
    }
    if (data.session?.user) await redirectUser(data.session.user);
    else message.textContent = "Sign in with Google to continue.";
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_IN" && session?.user) setTimeout(() => redirectUser(session.user), 0);
  });
  initialize();
})();
</script>
</body>
</html>
